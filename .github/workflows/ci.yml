name: KubeWatch CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - run: pip install -r requirements.txt
    - run: python -m pytest -v
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install -r requirements.txt
    - run: bandit -r app
    - run: pip-audit -r requirements.txt
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: frontend/package.json
    - run: npm install
    - run: npm run build
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, security, frontend-build]
    steps:
    - uses: actions/checkout@v4
    - run: docker build -t kubewatch-backend:ci ./backend
    - run: docker build -t kubewatch-frontend:ci ./frontend
