apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubewatch-backend
  namespace: kubewatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubewatch-backend
  template:
    metadata:
      labels:
        app: kubewatch-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: kubewatch-backend:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        readinessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kubewatch-backend
  namespace: kubewatch
spec:
  selector:
    app: kubewatch-backend
  ports:
  - name: http
    port: 8000
    targetPort: http
  type: ClusterIP
