apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubewatch-frontend
  namespace: kubewatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubewatch-frontend
  template:
    metadata:
      labels:
        app: kubewatch-frontend
    spec:
      containers:
      - name: web
        image: kubewatch-frontend:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet: {path: /, port: http}
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /, port: http}
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kubewatch-frontend
  namespace: kubewatch
spec:
  selector:
    app: kubewatch-frontend
  ports:
  - name: http
    port: 80
    targetPort: http
  type: ClusterIP
